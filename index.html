<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no"/>
  <title>PipeCounter</title>

  <!-- PWA -->
  <link rel="manifest" href="manifest.json"/>
  <meta name="theme-color" content="#1a1d27"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="PipeCounter"/>
  <link rel="apple-touch-icon" href="assets/icons/icon-192.png"/>

  <link rel="stylesheet" href="style.css"/>
  <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.17.3/dist/ort.min.js"></script>
</head>
<body>

<header>
  <h1>Pipe<span>Counter</span></h1>
</header>

<main>
  <p class="status" id="status">Loading AI model…</p>

  <!-- Image preview (shared across crop / scan / edit states) -->
  <div class="image-wrap" id="image-wrap" hidden>
    <img id="preview" alt="" hidden/>
    <canvas id="crop-overlay" hidden></canvas><!-- crop tool overlay -->
    <canvas id="overlay"      hidden></canvas><!-- detection circles -->
  </div>

  <!-- ── IDLE: pick image + choose mode ─────────────────────────── -->
  <section id="sec-idle">
    <div class="mode-row">
      <label class="mode-btn selected" id="lbl-std">
        <input type="radio" name="res" id="mode-std" checked/>
        ⚡ Standard
        <div class="mode-sub">Faster · good for large pipes</div>
      </label>
      <label class="mode-btn" id="lbl-high">
        <input type="radio" name="res" id="mode-high"/>
        🔍 High-Res
        <div class="mode-sub">Slower · catches small pipes</div>
      </label>
    </div>
    <!-- Confidence / sensitivity slider -->
    <div class="slider-row">
      <label class="slider-label" for="conf-slider">
        Detection sensitivity:
        <span id="conf-val">Medium</span>
      </label>
      <input type="range" id="conf-slider" min="5" max="50" step="1" value="20"/>
      <div class="slider-ticks"><span>Low</span><span>High</span></div>
    </div>

    <button class="btn-accent full-width" id="pick-btn">📷 Pick Image</button>
    <input type="file" id="file-input" accept="image/*" hidden/>
  </section>

  <!-- ── CROP: adjust region before scanning ────────────────────── -->
  <section id="sec-crop" hidden>
    <p class="hint">Drag the corners to select the area you want to scan.<br/>
       You can also draw a new region by dragging on the image.</p>
    <div class="action-row">
      <button class="btn-secondary" id="skip-crop-btn">Scan Full Image</button>
      <button class="btn-accent"    id="apply-crop-btn">✂ Crop &amp; Scan</button>
    </div>
  </section>

  <!-- ── SCAN: progress ─────────────────────────────────────────── -->
  <section id="sec-scan" hidden>
    <div class="progress-track">
      <div class="progress-fill" id="progress-bar"></div>
    </div>
    <p class="progress-label" id="progress-lbl">Starting…</p>
    <button class="btn-secondary" id="cancel-btn">Cancel</button>
  </section>

  <!-- ── EDIT: results + interactive editing ────────────────────── -->
  <section id="sec-edit" hidden>
    <div class="count-row">
      <div class="count-number" id="count-lbl">0</div>
      <div class="count-label">pipe ends detected</div>
    </div>

    <div class="breakdown" id="breakdown"></div>

    <div class="edit-toolbar">
      <span class="edit-label">Action:</span>
      <button class="edit-btn active" id="btn-remove">✕ Remove</button>
      <button class="edit-btn"        id="btn-add">＋ Add</button>
    </div>

    <!-- Size filter — shown for both add and remove -->
    <div class="edit-toolbar" id="size-toolbar">
      <span class="edit-label">Size:</span>
      <button class="edit-btn size-btn" id="sz-small"  data-size="small">● Small</button>
      <button class="edit-btn size-btn active" id="sz-any" data-size="any">◎ Any</button>
      <button class="edit-btn size-btn" id="sz-large"  data-size="large">◉ Large</button>
    </div>

    <p class="hint" id="edit-hint">Tap a circle on the image to remove it.
       Pinch to zoom · drag to pan when zoomed.</p>

    <div class="action-row">
      <button class="btn-secondary" id="share-btn">⬆ Share</button>
      <button class="btn-secondary" id="new-scan-btn">↩ New Scan</button>
    </div>
  </section>
</main>

<script type="module" src="app.js"></script>

<script>
  // Mode button highlight
  ['mode-std','mode-high'].forEach(id => {
    document.getElementById(id).addEventListener('change', () => {
      document.getElementById('lbl-std').classList.toggle('selected',  document.getElementById('mode-std').checked);
      document.getElementById('lbl-high').classList.toggle('selected', document.getElementById('mode-high').checked);
    });
  });
</script>
</body>
</html>
